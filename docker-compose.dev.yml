services:
  backend:
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--no-access-log"
      ]
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config

  frontend:
    build:
      target: builder
    command: ["npm", "run", "dev"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
