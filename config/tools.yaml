version: '1.0'
description: Hierarchical catalogue of AI tools for a configuration-driven AI tools platform.
default_model: openrouter/free
tool_defaults:
  description_template: "A guided {name} assistant for your work."
  input_schema:
    fields:
    - name: context
      label: What would you like help with?
      type: textarea
      required: true
      placeholder: Describe your task and include any relevant details.
    - name: additional_context
      label: Additional context
      type: textarea
      required: false
      placeholder: Add preferences, constraints, or examples.
  system_prompt: >-
    You are a helpful assistant completing the user's requested task. Use the
    supplied context, follow the selected tone, avoid inventing facts, and
    return a clear, useful result.
  tones:
  - id: professional
    name: Professional
    instructions: Use a clear, polished, workplace appropriate voice.
  - id: formal
    name: Formal
    instructions: Use precise language and a formal structure.
  - id: casual
    name: Casual
    instructions: Use a friendly, natural voice.
  - id: concise
    name: Concise
    instructions: Keep the response brief while preserving essential detail.
  - id: simple
    name: Simple English
    instructions: Use plain language and explain unfamiliar terms.
  enabled: true
